# One ArgoCD Application per open PR into master, torn down when the PR closes.
# Apply this directly to the cluster, NOT managed by ArgoCD itself:
#   kubectl apply -f k8s/argocd-applicationset-previews.yaml
#
# Images are built by .github/workflows/pr-preview-image.yml. Until the build
# for a new commit finishes (~3-5 min), the pod sits in ImagePullBackOff and
# then recovers on its own.
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: portfolio-pr-previews
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - pullRequest:
        # The repo is public, so polling works without a token (60 req/h limit).
        # To poll faster, create a secret with a read-only PAT and uncomment:
        #   kubectl -n argocd create secret generic github-token --from-literal=token=<PAT>
        requeueAfterSeconds: 300
        github:
          owner: Gnzaga
          repo: Personal-Portfolio-Site
          # tokenRef:
          #   secretName: github-token
          #   key: token
        filters:
          - targetBranchMatch: "^master$"
  template:
    metadata:
      name: 'portfolio-pr-{{.number}}'
      labels:
        app.kubernetes.io/part-of: portfolio-previews
    spec:
      project: default
      source:
        repoURL: https://github.com/Gnzaga/Personal-Portfolio-Site.git
        # Manifests come from the PR branch, so a PR can change its own k8s config.
        targetRevision: '{{.head_sha}}'
        path: k8s/overlays/preview
        kustomize:
          images:
            - 'harbor.gnzaga.com/apps/portfolio-website=ghcr.io/gnzaga/personal-portfolio-site:pr-{{.number}}-{{.head_sha}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'portfolio-pr-{{.number}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        managedNamespaceMetadata:
          labels:
            app.kubernetes.io/part-of: portfolio-previews
