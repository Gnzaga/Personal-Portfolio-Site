# One live dev environment per open PR into master, torn down when the PR closes.
# Apply this directly to the cluster, NOT managed by ArgoCD itself:
#   kubectl apply -f k8s/argocd-applicationset-previews.yaml
#
# ArgoCD only creates and deletes the environments. Code updates never go
# through ArgoCD: the pod polls the PR branch every few seconds and
# hot-reloads (see k8s/preview/sync-and-serve.sh).
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: portfolio-pr-previews
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - pullRequest:
        # How quickly a NEW PR gets an environment. The repo is public, so this
        # works without a token (60 req/h limit). To poll faster, create a secret
        # with a read-only PAT, uncomment tokenRef and lower this to ~30:
        #   kubectl -n argocd create secret generic github-token --from-literal=token=<PAT>
        requeueAfterSeconds: 300
        github:
          owner: Gnzaga
          repo: Personal-Portfolio-Site
          # tokenRef:
          #   secretName: github-token
          #   key: token
        filters:
          - targetBranchMatch: "^master$"
  template:
    metadata:
      name: 'portfolio-pr-{{.number}}'
      labels:
        app.kubernetes.io/part-of: portfolio-previews
    spec:
      project: default
      source:
        repoURL: https://github.com/Gnzaga/Personal-Portfolio-Site.git
        targetRevision: master
        path: k8s/preview
        kustomize:
          patches:
            - target:
                kind: Deployment
                name: portfolio-dev
              # env/1 is BRANCH in k8s/preview/deployment.yaml
              patch: |-
                - op: replace
                  path: /spec/template/spec/containers/0/env/1/value
                  value: '{{.branch}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'portfolio-pr-{{.number}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        managedNamespaceMetadata:
          labels:
            app.kubernetes.io/part-of: portfolio-previews
