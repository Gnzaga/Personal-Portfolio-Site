# Per-PR preview environment. Rendered by the ApplicationSet in
# k8s/argocd-applicationset-previews.yaml, which sets the namespace
# (portfolio-pr-<N>) and the image tag.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ghcr-external-secret.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: portfolio-previews

patches:
  - target:
      kind: Deployment
      name: portfolio-website
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ghcr-registry
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "development"
      # openrouter-api-key is created by hand in the prod namespace only;
      # let previews start without it (the chat widget is then disabled).
      - op: add
        path: /spec/template/spec/containers/0/env/4/valueFrom/secretKeyRef/optional
        value: true
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          limits:
            memory: "384Mi"
            cpu: "250m"
          requests:
            memory: "128Mi"
            cpu: "50m"

  # Private access only: each preview gets its own LAN IP from the cluster's
  # LoadBalancer (reachable over Tailscale via your subnet router).
  # With the Tailscale k8s operator installed, uncomment to get
  # http://portfolio-pr-<N>-portfolio-website on your tailnet instead.
  # - target:
  #     kind: Service
  #     name: portfolio-website
  #   patch: |
  #     - op: add
  #       path: /metadata/annotations/tailscale.com~1expose
  #       value: "true"
