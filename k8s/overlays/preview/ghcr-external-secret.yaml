# ExternalSecret - pulls GHCR credentials from Vault for preview images.
# Needs a GitHub PAT (classic) with read:packages stored at Vault key
# `portfolio`, properties `ghcr_username` / `ghcr_token`.
# If the GHCR package is public this secret is optional: the kubelet falls
# back to an anonymous pull when it is missing.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-registry
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ghcr-registry
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":{{ .username | toJson }},"password":{{ .password | toJson }},"auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}'
  data:
    - secretKey: username
      remoteRef:
        key: portfolio
        property: ghcr_username
    - secretKey: password
      remoteRef:
        key: portfolio
        property: ghcr_token
